<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - InvestPro</title>

    <link rel="stylesheet" href="css/style.css">
    <meta property="og:title" content="Join InvestPro">
<meta property="og:description" content="Create your InvestPro account.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://investorsite.netlify.app/signup.html">
</head>

<body>

<header>
    <div class="logo">InvestPro</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="auth-section">

    <div class="auth-box">
      

        <h1>Create Account</h1>

        <p>Create your InvestPro account 📥</p>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

            <p id="message"></p>

        </form>
      <button type="button" id="googleBtn" class="auth-btn"
        style="background:#fff;color:#111;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/>
    </svg>
    <span>Continue with Google</span>
</button>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>


    </div>

</section>
<footer>

    <p>
        © 2026 InvestPro.created by Tesla company, trusted by millions of people.
    </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<<script>document.getElementById("googleBtn")?.addEventListener("click", async () => {
// remember a referral code from the link (signup.html?ref=CODE)
const ref = new URLSearchParams(window.location.search).get("ref");
if (ref) localStorage.setItem("pending_ref", ref);

const { error } = await supabaseClient.auth.signInWithOAuth({
provider: "google",
options: {
redirectTo: window.location.origin +
window.location.pathname.replace(/[^/]*$/, "") + "dashboard.html",
},
});
if (error) alert("Google login failed: " + error.message);
});</script>


<style>
.pw-rules{list-style:none;padding:0;margin:8px 0 0;font-size:13px}
.pw-rules li{color:#9aa4b2;margin:3px 0}
.pw-rules li::before{content:"○ "}
.pw-rules li.ok{color:#22c55e}
.pw-rules li.ok::before{content:"✓ "}
.pw-error{color:#f87171;font-size:14px;margin:8px 0 0;min-height:18px}
</style>

<script>
(function () {
  const inputs = document.querySelectorAll('input[type="password"]');
  if (!inputs.length) return;

  const pw = inputs[0];
  const confirmPw = inputs[1] || null;
  const form = pw.closest("form");
  if (!form) return;

  const rules = [
    ["At least 8 characters", (v) => v.length >= 8],
    ["One uppercase letter (A-Z)", (v) => /[A-Z]/.test(v)],
    ["One lowercase letter (a-z)", (v) => /[a-z]/.test(v)],
    ["One number (0-9)", (v) => /[0-9]/.test(v)],
  ];

  const list = document.createElement("ul");
  list.className = "pw-rules";
  const items = rules.map(([text]) => {
    const li = document.createElement("li");
    li.textContent = text;
    list.appendChild(li);
    return li;
  });

  const error = document.createElement("p");
  error.className = "pw-error";

  (confirmPw || pw).insertAdjacentElement("afterend", error);
  pw.insertAdjacentElement("afterend", list);

  function check() {
    let all = true;
    rules.forEach(([, test], i) => {
      const ok = test(pw.value);
      items[i].classList.toggle("ok", ok);
      if (!ok) all = false;
    });
    return all;
  }
  pw.addEventListener("input", () => { check(); error.textContent = ""; });

  function guard(e) {
    if (!check()) {
      e.preventDefault();
      e.stopImmediatePropagation();
      error.textContent = "Password must meet all the rules above.";
      pw.focus();
      return;
    }
    if (confirmPw && confirmPw.value !== pw.value) {
      e.preventDefault();
      e.stopImmediatePropagation();
      error.textContent = "Passwords do not match.";
      confirmPw.focus();
    }
  }

  // runs before your auth.js code, for both the form and its submit button
  form.addEventListener("submit", guard, true);
  form.addEventListener("click", (e) => {
    if (e.target.closest('button[type="submit"], button:not([type]), input[type="submit"]')) {
      guard(e);
    }
  }, true);
})();
</script>
</body>
</html>
