<!DOCTYPE html>
<html>
<head>
  <title>Admin - InvestPro</title>
  <style>
    body{background:#030712;color:white;padding:20px;font-family:sans-serif}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
    .stat-card{background:#111827;padding:20px;border-radius:12px}
    .stat-card h3{color:#9CA3AF;font-size:13px}
    .stat-card h1{font-size:24px;margin-top:10px}
    table{width:100%;border-collapse:collapse;background:#111827;border-radius:12px;overflow:hidden}
    th,td{padding:14px;text-align:left;border-bottom:1px solid #1F2937}
    th{background:#1F2937}
    .btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
    .approve{background:#22C55E;color:white}
    .reject{background:#EF4444;color:white}
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card"><h3>Total Users</h3><h1 id="users">0</h1></div>
    <div class="stat-card"><h3>Total Balance</h3><h1>₦<span id="totalBalance">0</span></h1></div>
    <div class="stat-card"><h3>Pending Deposits</h3><h1 id="pendingDep">0</h1></div>
    <div class="stat-card"><h3>Pending Withdrawals</h3><h1 id="pendingWith">0</h1></div>
  </div>

  <h2>Pending Transactions</h2>
  <table>
    <thead><tr><th>User</th><th>Type</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead>
    <tbody id="txBody"></tbody>
  </table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const supabase = window.supabase.createClient('https://oatkpqfhaqnqlpgmuoxe.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hdGtwcWZoYXFucWxwZ211b3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDI4MzAsImV4cCI6MjEwMzcxODgzMH0.qirRtKQdQPjQjeeohBU0mf-bB61nK0tNmQ6sEjHon_M')

  async function loadAdmin(){
    // Stats
    const { count: userCount } = await supabase.from('profiles').select('*', {count:'exact'})
    const { data: profiles } = await supabase.from('profiles').select('balance')
    const totalBal = profiles.reduce((a,b) => a + b.balance, 0)
    
    const { data: pending } = await supabase.from('transactions').select('*').eq('status','pending')
    const pendingDep = pending.filter(t => t.type === 'deposit').length
    const pendingWith = pending.filter(t => t.type === 'withdraw').length

    document.getElementById('users').innerText = userCount
    document.getElementById('totalBalance').innerText = totalBal.toLocaleString()
    document.getElementById('pendingDep').innerText = pendingDep
    document.getElementById('pendingWith').innerText = pendingWith

    // Table
    const { data: txs } = await supabase.from('transactions')
      .select('*, profiles(email, full_name)')
      .eq('status','pending').order('created_at', {ascending:false})
    
    document.getElementById('txBody').innerHTML = txs.map(tx => `
      <tr>
        <td>${tx.profiles.full_name}<br><small>${tx.profiles.email}</small></td>
        <td>${tx.type}</td>
        <td>₦${tx.amount.toLocaleString()}</td>
        <td>${new Date(tx.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn approve" onclick="approveTx('${tx.id}','${tx.user_id}',${tx.amount},'${tx.type}')">Approve</button>
          <button class="btn reject" onclick="rejectTx('${tx.id}')">Reject</button>
        </td>
      </tr>
    `).join('')
  }
  loadAdmin()

  window.approveTx = async (txId, userId, amount, type) => {
    const { data: profile } = await supabase.from('profiles').select('balance, referred_by').eq('id', userId).single()
    let newBal = profile.balance
    
    if(type === 'deposit'){
      newBal += amount
      // Pay 10% referral bonus
      if(profile.referred_by){
        const bonus = amount * 0.1
        await supabase.from('profiles').update({
          balance: supabase.raw(`balance + ${bonus}`),
          total_earned: supabase.raw(`total_earned + ${bonus}`)
        }).eq('id', profile.referred_by)
      }
    } 
    if(type === 'withdraw') newBal -= amount

    await supabase.from('profiles').update({balance: newBal}).eq('id', userId)
    await supabase.from('transactions').update({status:'approved'}).eq('id', txId)
    alert('Approved')
    loadAdmin()
  }

  window.rejectTx = async (txId) => {
    await supabase.from('transactions').update({status:'rejected'}).eq('id', txId)
    alert('Rejected')
    loadAdmin()
  }
</script>
</body>
</html>
