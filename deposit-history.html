<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History - InvestPro</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
  .dh-tabs button{font-size:14px;padding:10px 6px}
   
  </style>
</head>
<body>
  <a href="index.html" class="logo">
  <img src="images/logo.svg" alt="InvestPro logo" width="36" height="36">
  <span>InvestPro</span>
</a>
  <div class="dh-wrap">
    <div class="dh-top">
      <h2>📜 Transaction History</h2>
      <a href="dashboard.html">← Back to Dashboard</a>
    </div>

    <div class="dh-tabs" id="dhTabs">
      <button class="active" data-tab="deposits">💳 Deposits</button>
      <button data-tab="returns">📈 Returns</button>
      <button data-tab="withdrawals">💸 Withdrawals</button>
    </div>

    <div class="dh-total" id="dhTotal">Loading...</div>
    <div class="dh-filters" id="dhFilters"></div>
    <div id="dhList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/Supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/deposit-history.js"></script>
</body>
</html>
