<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body{background:#070A14;color:white;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
    .box{background:#111827;padding:30px;border-radius:16px;width:350px}
    input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #334155;background:#070A14;color:white}
    button{width:100%;padding:12px;background:#4F46E5;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer}
    a{color:#818CF8;text-align:center;display:block;margin-top:15px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <a href="signup.html">Don't have an account? Sign Up</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import { signIn } from './assets/js/supabase.js'
  
  window.handleLogin = async () => {
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    
    try{
      await signIn(email, password)
      window.location.href = 'dashboard.html'
    }catch(e){ alert(e.message) }
  }
</script>
</body>
</html>
