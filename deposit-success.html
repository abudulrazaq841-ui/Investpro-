<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - InvestPro</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #0b1324; color: #fff; font-family: sans-serif; margin: 0; }
        .ds-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .ds-card { width: 100%; max-width: 420px; background: #1e293b; border-radius: 24px; padding: 32px 24px; text-align: center; }
        .ds-icon { font-size: 56px; margin-bottom: 8px; }
        .ds-card h2 { margin: 8px 0; }
        .ds-card p { color: #9aa4b2; }
        .ds-btn { display: block; margin-top: 14px; padding: 14px; border-radius: 14px; background: #3b82f6; color: #fff; text-decoration: none; font-weight: 600; }
        .ds-btn.alt { background: #334155; }
    </style>
</head>
<body>
<div class="ds-wrap">
    <div class="ds-card">
        <div class="ds-icon" id="dsIcon">⏳</div>
        <h2 id="dsTitle">Confirming your payment...</h2>
        <p id="dsText">Please wait a few seconds.</p>
        <a class="ds-btn" href="dashboard.html">Go to Dashboard</a>
        <a class="ds-btn alt" href="plans.html" id="dsPlans" style="display:none">Continue to Plans →</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/Supabase.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const txRef = params.get("tx_ref");
const flwStatus = params.get("status");

function show(icon, title, text, showPlans) {
    document.getElementById("dsIcon").textContent = icon;
    document.getElementById("dsTitle").textContent = title;
    document.getElementById("dsText").textContent = text;
    document.getElementById("dsPlans").style.display = showPlans ? "" : "none";
}

async function checkDeposit() {
    if (flwStatus === "cancelled") {
        show("❌", "Payment cancelled", "No money was taken.", false);
        return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }

    if (!txRef) {
        show("ℹ️", "Payment page", "Open your dashboard to see your balance.", false);
        return;
    }

    // the webhook credits the balance; wait for it (up to ~30 seconds)
    for (let i = 0; i < 10; i++) {
        const { data } = await supabaseClient
            .from("demo_deposits")
            .select("status, amount")
            .eq("payment_reference", txRef)
            .eq("user_id", user.id)
            .maybeSingle();

        if (data?.status === "approved") {
            show("✅", "Deposit successful",
                "₦" + Number(data.amount).toLocaleString("en-NG") +
                " has been added to your balance.", true);
            return;
        }
        await new Promise((r) => setTimeout(r, 3000));
    }

    show("⏳", "Still processing",
        "Your payment is being confirmed. Check your balance in a minute.", true);
}

checkDeposit();
</script>
</body>
</html>
