<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Status - Investpro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 40px 30px;
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
    }
    .success { color: #22c55e; font-size: 52px; margin-bottom: 10px; }
    .failed { color: #ef4444; font-size: 52px; margin-bottom: 10px; }
    a {
      display: inline-block;
      margin-top: 25px;
      background: #3b82f6;
      color: white;
      padding: 13px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="icon">Verifying payment...</div>
    <h2 id="title">Please wait</h2>
    <p id="message">We are confirming your deposit...</p>
    <a href="dashboard.html" id="btn" style="display:none;">Go to Dashboard</a>
  </div>

  <script src="js/Supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get("status");
    const tx_ref = params.get("tx_ref") || localStorage.getItem('pending_tx_ref');

    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const btn = document.getElementById("btn");

    async function processDeposit() {
      if (status !== "successful" && status !== "completed") {
        icon.innerHTML = `<div class="failed">✕</div>`;
        title.innerText = "Payment Failed or Cancelled";
        message.innerText = "The payment was not completed. Please try again.";
        btn.style.display = "inline-block";
        return;
      }

      if (!tx_ref) {
        icon.innerHTML = `<div class="failed">✕</div>`;
        title.innerText = "Missing Reference";
        message.innerText = "Transaction reference not found.";
        btn.style.display = "inline-block";
        return;
      }

      try {
        // Call your existing verify function
        const { data, error } = await supabase.functions.invoke('flutterwave-verify', {
          body: {
            tx_ref: tx_ref
          }
        });

        if (error || !data?.success) {
          throw new Error(data?.message || error?.message || "Verification failed");
        }

        // Clear temporary data
        localStorage.removeItem('pending_tx_ref');
        localStorage.removeItem('pending_amount');

        // Success
        icon.innerHTML = `<div class="success">✓</div>`;
        title.innerText = "Deposit Successful!";
        message.innerText = data.message || "Your account has been credited successfully.";
        btn.style.display = "inline-block";

      } catch (err) {
        console.error(err);
        icon.innerHTML = `<div class="failed">✕</div>`;
        title.innerText = "Verification Error";
        message.innerText = err.message || "Something went wrong while confirming your payment.";
        btn.style.display = "inline-block";
      }
    }

    processDeposit();
  </script>
</body>
</html>
