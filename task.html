<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Earn Rewards - InvestPro</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .tasks-wrapper {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .rewards-header {
            background: #151a25;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid #1e293b;
        }

        .reward-amount {
            color: #22c55e;
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .task-card {
            background: #151a25;
            border: 1px solid #1e293b;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .task-card h3 {
            margin-bottom: 10px;
        }

        .task-reward {
            color: #22c55e;
            font-weight: bold;
            margin: 12px 0;
        }

        .task-card input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            background: #1e2535;
            color: white;
            border: 1px solid #2a3447;
            border-radius: 8px;
        }

        .task-btn {
            display: inline-block;
            padding: 12px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .task-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .task-status {
            margin-top: 12px;
            font-weight: bold;
        }

        .pending {
            color: #facc15;
        }

        .approved {
            color: #22c55e;
        }

        .rejected {
            color: #ef4444;
        }

        .task-message {
            margin-top: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <main class="tasks-wrapper">

        <div class="rewards-header">

            <h2>InvestPro Rewards Center</h2>

            <p>Complete social media tasks and earn demo rewards.</p>

            <div class="reward-amount">
                ₦<span id="rewardsBalance">0.00</span>
            </div>

            <p>My Rewards Balance</p>

            <p>
                Completed Tasks:
                <span id="completedTasks">0</span>/3
            </p>

        </div>

        <h2>Available Tasks</h2>

        <div id="tasksContainer">

            Loading available tasks...

        </div>

        <p id="taskMessage" class="task-message"></p>

    </main>


    <!-- Supabase -->

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/tasks.js"></script>
</body>
</html>
