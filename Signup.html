<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - InvestDash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #1e293b, #0f172a);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .card {
    background: #1e293b;
    padding: 40px 30px;
    border-radius: 16px;
    border: 1px solid #334155;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.6s;
  }
  .card h1 {
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
  }
  .card input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    font-size: 16px;
  }
  .card button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .card button:hover { transform: scale(1.02); }
  .link { text-align: center; margin-top: 15px; color: #94a3b8; }
  .link a { color: #38bdf8; text-decoration: none; }
  .msg { text-align: center; margin-top: 10px; font-size: 14px; }
  .success { color: #22c55e; }
  .error { color: #ef4444; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="card">
  <h1>Create Account</h1>
  <form id="signupForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>
  <div id="message" class="msg"></div>
  <div class="link">
    Already have an account? <a href="Login.html">Login</a>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // 1. PASTE YOUR KEYS HERE
  const SUPABASE_URL = 'https://oatkpqfhaqnqlpgmuoxe.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hdGtwcWZoYXFucWxwZ211b3hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDI4MzAsImV4cCI6MjEwMzcxODgzMH0.qirRtKQdQPjQjeeohBU0mf-bB61nK0tNmQ6sEjHon_M'
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // 1. Create Auth User
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) return alert('Error: ' + error.message);

    // 2. Create Profile with ₦50,000 bonus

      { id: data.user.id, email: email, full_name: fullName, balance: 50000 }
    ]);
    if(profileError) return alert('Error: ' + profileError.message);

    alert('Account Created! ₦50,000 bonus added. Check email to verify.');
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
